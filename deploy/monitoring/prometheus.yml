global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

scrape_configs:
  - job_name: ui
    static_configs:
      - targets: ["localhost:8080"]
  - job_name: sglang
    static_configs:
      - targets: ["localhost:30000"]
  - job_name: dcgm            # only reports when the gpu profile is running
    static_configs:
      - targets: ["localhost:9400"]
