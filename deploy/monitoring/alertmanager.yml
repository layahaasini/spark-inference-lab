# Alertmanager routing. Alerts work without credentials; sending them to Slack
# or email needs a secret that stays out of git. To enable Slack:
#   1. create an incoming webhook in your Slack workspace
#   2. on the Spark: mkdir -p ~/.config/sparklab && echo "<webhook url>" > ~/.config/sparklab/slack_webhook
#   3. set the channel below and `docker compose restart alertmanager`
# Email works the same way via smtp_* fields (see commented block).
route:
  receiver: default
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: default
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook
        channel: "#spark-alerts"
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ .CommonAnnotations.description }}"
        send_resolved: true   # also post when the condition clears
    # email_configs:
    #   - to: you@example.com
    #     from: alerts@example.com
    #     smarthost: smtp.example.com:587
    #     auth_username: alerts@example.com
    #     auth_password_file: /etc/alertmanager/secrets/smtp_password
