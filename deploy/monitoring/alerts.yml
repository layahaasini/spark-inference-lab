# Alert rules. Loaded by Prometheus (see prometheus.yml rule_files), routed by
# Alertmanager. Every rule answers one question: "would this invalidate or
# block a measurement?"
groups:
  - name: sparklab
    rules:
      - alert: SGLangDown
        expr: up{job="sglang"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "SGLang server unreachable for 1m"
          description: "No metrics scrape from localhost:30000. Serving is down or wedged; check systemctl --user status sparklab-server and journalctl."

      - alert: SGLangRestarted
        expr: sum(resets(sglang:num_requests_total[10m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "SGLang restarted within the last 10m"
          description: "Counter reset detected: the radix cache was wiped. Any measurement window overlapping this period is invalid."

      - alert: LowRadixHitRate
        # traffic gate is a rate over the window, NOT an instantaneous gauge:
        # a gauge gate (num_running_reqs > 0) empties on any idle scrape and
        # resets the for-timer, so the alert could never fire on bursty traffic
        expr: sglang:cache_hit_rate < 0.30 and rate(sglang:num_requests_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Radix hit rate below 30% under load for 5m"
          description: "Sustained low hit rate while serving traffic — eviction thrash or a workload without shared prefixes."

      - alert: UIDown
        expr: up{job="ui"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Inference UI unreachable for 2m"
          description: "No metrics scrape from localhost:8080 — the one failure the error-ratio alert cannot see. Check systemctl --user status sparklab-ui."

      - alert: UIErrorRatio
        # a ratio, not an absolute rate: a single-user UI never reaches N req/s,
        # so 'errors > 0.1/s' could not fire even with every request failing
        expr: >
          sum(increase(sparklab_ui_requests_total{status="error"}[5m])) >= 3
          and sum(increase(sparklab_ui_requests_total{status="error"}[5m]))
            / clamp_min(sum(increase(sparklab_ui_requests_total[5m])), 1) > 0.5
        labels: { severity: warning }
        annotations:
          summary: "Majority of UI requests failing (last 5m)"
          description: "The inference UI is failing most requests — check sparklab-ui logs and whether the server behind it is healthy."
