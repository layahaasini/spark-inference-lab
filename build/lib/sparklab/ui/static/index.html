<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sparklab inference</title>
<style>
  :root { color-scheme: dark; }
  body { background:#111318; color:#e6e6e6; font:15px/1.5 system-ui, sans-serif;
         max-width:820px; margin:2rem auto; padding:0 1rem; }
  h1 { font-size:1.15rem; font-weight:600; }
  h1 span { color:#8a8f98; font-weight:400; }
  textarea { width:100%; min-height:7rem; background:#1a1d24; color:inherit;
             border:1px solid #2c313a; border-radius:8px; padding:.7rem; font:inherit; resize:vertical; }
  .row { display:flex; gap:.75rem; align-items:center; margin:.6rem 0 1rem; }
  input[type=number] { width:6rem; background:#1a1d24; color:inherit;
             border:1px solid #2c313a; border-radius:6px; padding:.35rem .5rem; font:inherit; }
  button { background:#3b82f6; color:#fff; border:0; border-radius:8px;
           padding:.5rem 1.1rem; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #stats { color:#8a8f98; font-size:.85rem; margin:.5rem 0; min-height:1.2rem; }
  #stats b.hit { color:#4ade80; }
  #out { background:#1a1d24; border:1px solid #2c313a; border-radius:8px;
         padding:.7rem; white-space:pre-wrap; min-height:3rem; }
  #out.err { color:#f87171; }
</style>
</head>
<body>
  <h1>sparklab inference <span>· Qwen2.5-0.5B on the Spark · cache stats per request</span></h1>
  <textarea id="prompt" placeholder="Prompt… (Cmd/Ctrl+Enter to send)"></textarea>
  <div class="row">
    <label for="maxtok">max new tokens</label>
    <input id="maxtok" type="number" value="128" min="1" max="2048">
    <button id="send">Generate</button>
  </div>
  <div id="stats"></div>
  <div id="out"></div>
<script>
  const $ = id => document.getElementById(id);
  async function go() {
    const prompt = $("prompt").value.trim();
    if (!prompt) return;
    $("send").disabled = true;
    $("out").className = ""; $("out").textContent = "…";
    $("stats").textContent = "";
    try {
      const r = await fetch("/api/generate", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({prompt, max_new_tokens: +$("maxtok").value || 128}),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.statusText);
      $("out").textContent = d.text;
      $("stats").innerHTML =
        `TTFT <b>${d.ttft_ms} ms</b> · total ${d.latency_ms} ms · ` +
        `prompt ${d.prompt_tokens} tok · cached ${d.cached_tokens} tok ` +
        `(<b class="hit">${(d.hit_rate*100).toFixed(1)}% hit</b>)`;
    } catch (e) {
      $("out").className = "err"; $("out").textContent = String(e);
    } finally { $("send").disabled = false; }
  }
  $("send").onclick = go;
  $("prompt").addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") go();
  });
</script>
</body>
</html>
