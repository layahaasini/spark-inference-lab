name: release-image

# A version tag names one immutable, runnable artifact: the NGC SGLang base
# (the serving-environment pin) with this repo's code baked in, built for the
# Spark's arm64 and pushed to GHCR.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual re-run without re-tagging

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The NGC base is 14.4 GB on-disk; pull + build cache + push staging needs
      # ~2x that, and stock runners have ~20 GB free. Dropping the preinstalled
      # Android/.NET/Haskell toolchains reclaims ~30 GB. Without this, the
      # runner dies mid-build with no logs (the v0.1.0 first-attempt failure).
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          swap-storage: false
      - uses: docker/setup-qemu-action@v3   # cross-build: runners are x86_64, the Spark is arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
