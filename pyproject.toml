[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparklab"
version = "0.2.0"
description = "Inference, kernel, and agentic-RL experiments on a DGX Spark, with a shared benchmarking module"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
    "httpx>=0.27",
]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparklab = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_server: requires a running SGLang server (set SGLANG_BASE_URL, default http://localhost:30000)",
    "needs_gpu: requires a CUDA GPU with Triton (P2 kernels; run inside the pytorch container on the Spark)",
]
